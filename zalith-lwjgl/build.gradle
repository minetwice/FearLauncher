plugins {
    id 'java-library'
}

// Zalith LWJGL 3.4.1 module - groovy port of ZalithLauncher2's LWJGL/3.4.1
// build.gradle.kts (credit MovTery, GPL-3.0). Merges the custom LWJGL jars +
// patched classes into ONE game-classpath jar under app assets.

group = 'org.lwjgl.glfw'
def lwjglVersion = '3.4.1'

// Merge inputs = ONLY the custom LWJGL jars from libs/3.4.1 (like Zalith's
// lwjglModules configuration) - must NOT leak into the Android app classpath.
def lwjglJars = fileTree(dir: "libs/${lwjglVersion}", include: ['*.jar'])

sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'patches-src/main/java', 'shared/src/main/java']
    }
}

dependencies {
    compileOnly fileTree(dir: 'compileOnly', include: ['*.jar'])
    // compileOnly: needed to compile patches, but must not transitively enter the APK
    compileOnly lwjglJars
    compileOnly 'org.jspecify:jspecify:1.0.0'
}

def excludedModules = [
        'lwjgl-lwjglx.jar', 'lwjgl.jar', 'jsr305.jar', 'lwjgl-freetype.jar',
        'lwjgl-jemalloc.jar', 'lwjgl-nanovg.jar', 'lwjgl-openal.jar',
        'lwjgl-stb.jar', 'lwjgl-tinyfd.jar', 'lwjgl-shaderc.jar',
        'lwjgl-spvc.jar', 'lwjgl-vma.jar', 'lwjgl-vulkan.jar', 'lwjgl-spng.jar'
]

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = "lwjgl-${lwjglVersion}-merged-modules"
    destinationDirectory = file("${rootDir}/app_pojavlauncher/src/main/assets/app_runtime/lwjgl/${lwjglVersion}")
    from({
        lwjglJars.filter { !excludedModules.contains(it.name) }.collect { zipTree(it) }
    })
    exclude 'net/java/openjdk/cacio/ctc/**'
    exclude 'META-INF/INDEX.LIST'
    doLast {
        copy {
            from(lwjglJars.filter { excludedModules.contains(it.name) })
            into destinationDirectory.get().asFile
        }
        new File(destinationDirectory.get().asFile, 'version').text = '3.4.1-fear'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Chinese comments in Zalith-ported sources need UTF-8; CI runners default to US-ASCII
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
