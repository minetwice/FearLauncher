name: fear-ui patch menufragment
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: restore and patch
        run: |
          git show f7a996ad6e218cee377d570f91ae145945f836aa:app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/MainMenuFragment.java > app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/MainMenuFragment.java
          echo  | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: commit
        run: |
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "fear-ui v5: remove runtime red tint/strokes from applyThemeColors (byte-exact re-push)"
          git push
