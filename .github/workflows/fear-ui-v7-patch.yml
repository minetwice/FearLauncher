name: fear-ui v7 patch
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: apply v7
        run: |
          echo  | base64 -d > /tmp/patch_v7.py
          python3 /tmp/patch_v7.py
      - name: commit
        run: |
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "fear-ui v7: landscape sync + play button DOWNLOADING state + skull liquid animation"
          git push
