name: Build Mesa Zink (arm64 OSMesa)

# Auto-builds Android aarch64 libOSMesa + Zink.
# Triggers: push to turbov1 branch, weekly schedule, or manual.
# Artifact: mesa-zink-arm64-osmesa.zip

on:
  push:
    branches:
      - turbov1-zink-fixed-v10
      - main
      - master
    paths:
      - '.github/workflows/build-mesa-zink.yml'
      - 'scripts/mesa/**'
  schedule:
    # Every Sunday 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      mesa_tag:
        description: 'Mesa git tag/branch (e.g. mesa-25.1.4)'
        required: false
        default: 'mesa-25.1.4'
        type: string

concurrency:
  group: mesa-zink-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aarch64:
    name: Mesa OSMesa+Zink aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools \
            libxrandr-dev libxxf86vm-dev libxcb-*-dev libx11-xcb-dev \
            libxfixes-dev libdrm-dev libx11-dev \
            bison flex gettext pkg-config \
            unzip curl git ccache gettext-base
          pip3 install --user mako meson ninja
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Env
        run: |
          echo "NDK_VER=android-ndk-r27c" >> $GITHUB_ENV
          echo "SDK_VER=29" >> $GITHUB_ENV
          echo "WORK_DIR=$(pwd)" >> $GITHUB_ENV
          TAG="${{ github.event.inputs.mesa_tag }}"
          if [ -z "$TAG" ]; then TAG="mesa-25.1.4"; fi
          echo "MESA_TAG=$TAG" >> $GITHUB_ENV
          echo "Building Mesa tag: $TAG"

      - name: Download NDK
        run: |
          curl -L "https://dl.google.com/android/repository/${NDK_VER}-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          rm ndk.zip

      - name: Clone Mesa + drm + build-fix
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/drm.git
          git clone --depth 1 --branch "${MESA_TAG}" https://gitlab.freedesktop.org/mesa/mesa.git \
            || git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git
          git clone --depth 1 --branch master https://github.com/Vera-Firefly/mesa-build-fix.git || true
          if [ -d mesa-build-fix ]; then
            cp -rf mesa-build-fix/* mesa/ || true
          fi

      - name: Write meson cross-files
        run: |
          cat > cross-drm.ini << 'EOF'
          [binaries]
          ndk = '${WORK_DIR}/${NDK_VER}/toolchains/llvm/prebuilt/linux-x86_64/bin'
          ar = ndk + '/llvm-ar'
          c = ['ccache', ndk + '/aarch64-linux-android${SDK_VER}-clang', '-O3', '-DVK_USE_PLATFORM_ANDROID_KHR', '-fPIC']
          cpp = ['ccache', ndk + '/aarch64-linux-android${SDK_VER}-clang++', '-O3', '-DVK_USE_PLATFORM_ANDROID_KHR', '-fPIC', '-fno-exceptions', '-static-libstdc++']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = ndk + '/aarch64-linux-android-strip'
          pkgconfig = ['env', 'PKG_CONFIG_LIBDIR=.', '/usr/bin/pkg-config']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          envsubst < cross-drm.ini > build-crossfile-drm

          cat > cross-mesa.ini << 'EOF'
          [binaries]
          ndk = '${WORK_DIR}/${NDK_VER}/toolchains/llvm/prebuilt/linux-x86_64/bin'
          ar = ndk + '/llvm-ar'
          c = ['ccache', ndk + '/aarch64-linux-android${SDK_VER}-clang', '-O3', '-DVK_USE_PLATFORM_ANDROID_KHR', '-fPIC']
          cpp = ['ccache', ndk + '/aarch64-linux-android${SDK_VER}-clang++', '-O3', '-DVK_USE_PLATFORM_ANDROID_KHR', '-fPIC', '-fno-exceptions', '-static-libstdc++', '-Wno-c++11-narrowing']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = ndk + '/aarch64-linux-android-strip'
          pkgconfig = ['env', 'PKG_CONFIG_LIBDIR=.:/tmp/drm-static/lib/pkgconfig', '/usr/bin/pkg-config']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          envsubst < cross-mesa.ini > build-crossfile

      - name: Build libdrm (static, freedreno kgsl)
        run: |
          cd drm
          meson setup build-android \
            --prefix=/tmp/drm-static \
            --cross-file "../build-crossfile-drm" \
            -Ddefault_library=static \
            -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled \
            -Dnouveau=disabled -Dvmwgfx=disabled \
            -Dfreedreno=enabled -Dvc4=disabled -Detnaviv=disabled \
            -Dfreedreno-kmds=kgsl
          ninja -C build-android install

      - name: Build Mesa (OSMesa + Zink)
        run: |
          cd mesa
          meson setup build-android \
            --prefix=/tmp/mesa \
            --cross-file "../build-crossfile" \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dandroid-strict=false \
            -Dxlib-lease=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dopengl=true \
            -Dosmesa=true \
            -Dvulkan-drivers= \
            -Dgallium-drivers=zink,freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dbuildtype=release
          ninja -C build-android -j"$(nproc)" install

      - name: Package
        run: |
          mkdir -p out/arm64-v8a
          if [ -f /tmp/mesa/lib/libOSMesa.so ]; then
            cp /tmp/mesa/lib/libOSMesa.so out/arm64-v8a/libOSMesa_8.so
          elif [ -f /tmp/mesa/lib/libOSMesa.so.8 ]; then
            cp /tmp/mesa/lib/libOSMesa.so.8 out/arm64-v8a/libOSMesa_8.so
          else
            echo "libOSMesa not found"
            find /tmp/mesa -name '*OSMesa*' || true
            find /tmp/mesa -name '*.so*' | head -40 || true
            exit 1
          fi
          ls -la /tmp/mesa/lib/ || true

          cat > out/README.txt << 'EOR'
          FearLauncher Mesa Zink pack (OSMesa + Zink, aarch64)

          LIB_MESA_NAME=libOSMesa_8.so
          Place arm64-v8a/libOSMesa_8.so in app native dir or files/mesa/
          Renderer: turnip_zink
          EOR

          cd out && zip -r ../mesa-zink-arm64-osmesa.zip .
          ls -lh ../mesa-zink-arm64-osmesa.zip
          file arm64-v8a/libOSMesa_8.so || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-zink-arm64-osmesa
          path: mesa-zink-arm64-osmesa.zip
          if-no-files-found: error
          retention-days: 30
