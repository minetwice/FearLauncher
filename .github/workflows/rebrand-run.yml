name: Rebrand run

on:
  push:
    branches: [fear-rebrand-run]

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mega-checkpoint
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Mega-checkpoint

      - name: Rename git.artdeell.mojo -> com.fearlauncher.fear
        run: |
          set -e
          git config user.name "fear-rebrand"
          git config user.email "actions@users.noreply.github.com"

          grep -rIl 'git\.artdeell\.mojo' . --exclude-dir=.git \
            | while IFS= read -r f; do
                sed -i 's/git\.artdeell\.mojo/com.fearlauncher.fear/g' "$f"
              done

          if [ -f app_pojavlauncher/mojo_upload.jks ]; then
            git mv app_pojavlauncher/mojo_upload.jks app_pojavlauncher/fear_upload.jks
          fi
          if [ -f app_pojavlauncher/mojo_pub.jks ]; then
            git mv app_pojavlauncher/mojo_pub.jks app_pojavlauncher/fear_pub.jks
          fi
          sed -i 's/mojo_upload\.jks/fear_upload.jks/g; s/mojo_pub\.jks/fear_pub.jks/g' app_pojavlauncher/build.gradle

          git rm -f .github/workflows/rebrand-mojo.yml || true

          git add -A
          git commit -m "Rebrand: git.artdeell.mojo -> com.fearlauncher.fear (namespace, keystores, scripts)" || echo "nothing to commit"
          git push origin HEAD:Mega-checkpoint
