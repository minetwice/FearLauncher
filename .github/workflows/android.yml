name: FearLauncher CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    name: Build FearLauncher APK
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.MOJOPUB_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # Pushes to this branch build and publish the FearLauncher nightly release.
      FEARLAUNCHER_RELEASE_BRANCH: Mega-checkpoint
      # FearLauncher's Google Play publishing needs BOTH secrets. Until they are
      # added to the repo, the gplay AAB build and the Play upload are skipped
      # instead of failing the whole build.
      HAS_PLAY_UPLOAD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD != '' && secrets.SERVICE_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get LTW (Lightweight Java Launcher Library)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔥🔥🔥 ये है नया Cache Method – सीधे Gradle Caches को Store/Restore करेगा 🔥🔥🔥
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Create out directory
        run: mkdir out

      # Release + Google Play steps run only for FearLauncher itself (owner check
      # keeps forks from publishing) and only on the release branch. The Play
      # steps additionally wait for the Play secrets to exist.
      - name: Build FearLauncher Publishing .aab (Google Play)
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH && env.HAS_PLAY_UPLOAD == 'true'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/FearLauncher-gplay.aab

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleFullDebug
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/FearLauncher-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FearLauncher-debug-noruntime.apk

      - name: Build FearLauncher Nightly Release .apk
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH
        run: |
          gradle :app_pojavlauncher:assembleFullPubRelease
          mv app_pojavlauncher/build/outputs/apk/full/pubRelease/app_pojavlauncher-full-pubRelease.apk out/FearLauncher-release.apk

      - name: Generate MD5 checksums
        run: |
          md5sum out/FearLauncher-debug-full.apk > out/FearLauncher-debug-full.md5
          md5sum out/FearLauncher-debug-noruntime.apk > out/FearLauncher-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FearLauncher-debug-full
          path: out/FearLauncher-debug-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: FearLauncher-debug-noruntime
          path: out/FearLauncher-debug-noruntime.apk

      - name: Publish FearLauncher Nightly Release (GitHub Release)
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH
        uses: softprops/action-gh-release@v3
        with:
          name: FearLauncher Nightly
          prerelease: true
          tag_name: nightly
          body: |
            FearLauncher nightly build.
            Branch: ${{ github.ref_name }}
            Commit hash: ${{ github.sha }}
          files: |
            out/FearLauncher-release.apk

      - name: Upload FearLauncher AAB (Google Play)
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH && env.HAS_PLAY_UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FearLauncher-release-aab
          path: out/FearLauncher-gplay.aab

      - name: Upload FearLauncher to Google Play (internal track)
        continue-on-error: true
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH && env.HAS_PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: com.fearlauncher.fear
          releaseFiles: out/FearLauncher-gplay.aab
          track: internal
          inAppUpdatePriority: 5
