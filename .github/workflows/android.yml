name: FearLauncher CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    name: Build FearLauncher APK
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.MOJOPUB_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # Pushes to this branch build and publish the FearLauncher nightly release.
      FEARLAUNCHER_RELEASE_BRANCH: Mega-checkpoint
      # FearLauncher's Google Play publishing needs BOTH secrets. Until they are
      # added to the repo, the gplay AAB build and the Play upload are skipped
      # instead of failing the whole build.
      HAS_PLAY_UPLOAD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD != '' && secrets.SERVICE_JSON != '' }}
      # Release signing for the public APK. The keystore is base64-encoded in the
      # RELEASE_KEYSTORE_BASE64 secret and decoded to a file below; the other
      # three are handed straight to Gradle. Until ALL four exist, CI falls back
      # to the existing public release build so forks and local runs never fail.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # LTW is built from its own source here, with ltw-overlay/ applied on top, rather
      # than downloading whatever the upstream CI last produced. The overlay fixes a real
      # crash: when LTW's bundled GLSL translator fails on a core shader it used to free
      # shader_info->source, skip the real glShaderSource call entirely, and leave a
      # dangling pointer that the next glLinkProgram walked with strlen(). Upstream's
      # newest build still has it, so no download can fix it - only a source build can.
      # The overlay also adds an in-process translation cache.
      #
      # JDK 11 first: the LTW project is on AGP 7.4.1, which is happiest on 11. The
      # launcher's own JDK 17 setup comes later and takes over again.
      - name: Set up JDK 11 (for the LTW build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build LTW from source (with our overlay)
        id: ltw_source
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p app_pojavlauncher/libs
          git clone https://github.com/MojoLauncher/LTW.git "$RUNNER_TEMP/ltw" || exit 1
          cd "$RUNNER_TEMP/ltw"
          git checkout 2f4dbaaa2494a9fe73d78dda859301b5c060fdd3 || exit 1
          cp "$GITHUB_WORKSPACE/ltw-overlay/shader_wrapper.c" ltw/src/main/tinywrapper/shader_wrapper.c
          grep -q FEARLAUNCHER ltw/src/main/tinywrapper/shader_wrapper.c || exit 1
          chmod +x gradlew
          ./gradlew --no-daemon :ltw:assembleRelease || exit 1
          cp ltw/build/outputs/aar/ltw-release.aar "$GITHUB_WORKSPACE/app_pojavlauncher/libs/ltw-release.aar"
          ls -l "$GITHUB_WORKSPACE/app_pojavlauncher/libs/"

      # If the source build could not run, fall back to the upstream artifact so the APK
      # still builds - it simply ships without the crash fix.
      - name: Get LTW (fallback - upstream prebuilt)
        if: steps.ltw_source.outcome != 'success'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      # The upstream LTW renderer leaks its own launcher name into the OpenGL
      # strings the game reads back (GL_VENDOR = "MojoLauncher", version banner
      # "%u.%u OpenLTW (Built on: ...)"). Branding those at runtime crashed the
      # device (SIGSEGV in __strlen_aarch64), so instead we rewrite the two
      # string literals INSIDE the prebuilt libltw.so at build time. Both
      # substitutions are the SAME byte length as the originals, so the .so
      # size, layout, offsets and code are untouched - only the literal bytes
      # change. This runs before any Gradle task packages the AAR's jni libs
      # into the APK. See scripts/patch_ltw_branding.py.
      - name: Patch LTW renderer branding strings (same-length, build time)
        run: |
          set -uo pipefail
          shopt -s nullglob
          AARS=(app_pojavlauncher/libs/*ltw*.aar)
          if [ ${#AARS[@]} -eq 0 ]; then
            echo "::warning::No LTW AAR found in app_pojavlauncher/libs (the LTW download may have failed) - nothing to patch."
            exit 0
          fi
          # Fails loudly ONLY on a length mismatch; a missing string is logged and skipped.
          python3 scripts/patch_ltw_branding.py "${AARS[@]}" || exit 1
          echo "----- strings proof from the patched AAR(s) -----"
          for aar in "${AARS[@]}"; do
            while IFS= read -r so; do
              echo "PROOF ${aar} :: ${so}"
              unzip -p "${aar}" "${so}" | strings -a | grep -aE 'MojoLauncher|OpenLTW|FearLauncher|FearLTW' | sed 's/^/    /' || true
            done < <(unzip -Z1 "${aar}" | grep 'libltw\.so$')
          done

      # The Discord Social SDK is handed out from Discord's developer portal rather than
      # from a public URL, so it cannot be committed to the repo the usual way. It is
      # attached to the nightly release instead, which gives it a stable public URL, and
      # fetched here before the build - the same pattern the other large binaries use.
      - name: Fetch the Discord Social SDK
        run: |
          set -euo pipefail
          mkdir -p app_pojavlauncher/libs
          curl -fL --retry 3 -o app_pojavlauncher/libs/discord_partner_sdk.aar \
            https://github.com/minetwice/FearLauncher/releases/download/nightly/discord_partner_sdk.aar
          ls -l app_pojavlauncher/libs/

      # The Android builds of LWJGL's lwjgl-vma, lwjgl-shaderc and lwjgl-spvc natives, which
      # are the three the engine loads as it starts. LWJGL's own natives for them are glibc
      # builds that cannot load on Android at all, and the launcher's own LWJGL is a 3.4.1
      # build that does not ship them, so nothing on the device could satisfy
      # liblwjgl_vma.so.
      #
      # The AAR is from the AngelAuraMC/lwjgl3 fork (LWJGL itself is BSD-3-Clause and the
      # fork is public), republished by CopperLauncher, whose launcher enables exactly these
      # bindings for VulkanMod. Pinned to a commit, not a branch.
      #
      # Only those three are kept. The AAR carries the whole of LWJGL for Android, and
      # Android puts every .so from an AAR into lib/<abi>/ - so shipping all of it put a
      # 3.3.3 liblwjgl.so in front of the launcher's 3.4.1 one and the JVM died before the
      # game started:
      #
      #   UnsatisfiedLinkError: 'int org.lwjgl.DefaultSysImplementation.getPointerSize()'
      #     at org.lwjgl.DesktopSysImplementation.getPointerSize
      #     at org.lwjgl.Sys.<clinit>
      #
      # Stripping it here also settles the extraction side: FearMonster copies whatever is
      # under components/lwjgl-3.3.3-natives/<abi>/ into java.library.path, so three files
      # in the assets means three files on the path.
      - name: Fetch the Android LWJGL natives
        run: |
          set -euo pipefail
          mkdir -p app_pojavlauncher/libs
          curl -fL --retry 3 -o app_pojavlauncher/libs/lwjgl-3.3.3-natives-release.aar \
            https://raw.githubusercontent.com/CopperLauncher/Copper-Android/259b7d6ddc6530476afed8e38f80533499b575d8/app_pojavlauncher/libs/lwjgl-3.3.3-natives-release.aar
          python3 - <<'PY'
          import os, zipfile
          src = 'app_pojavlauncher/libs/lwjgl-3.3.3-natives-release.aar'
          keep = ('liblwjgl_vma.so', 'libshaderc.so', 'liblwjgl_spvc.so')
          tmp = src + '.tmp'
          dropped = []
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if item.filename.endswith('.so') and not item.filename.endswith(keep):
                      dropped.append(item.filename)
                      continue
                  zout.writestr(item, zin.read(item.filename))
          os.replace(tmp, src)
          print('dropped', len(dropped), 'libraries:')
          for d in dropped:
              print('  -', d)
          print('kept only:', ', '.join(keep))
          PY
          ls -l app_pojavlauncher/libs/
          # Fail loudly if the natives the engine loads are not in it: an AAR without them
          # builds fine and leaves the engine dying on a library that was never there.
          unzip -l app_pojavlauncher/libs/lwjgl-3.3.3-natives-release.aar | grep -E "liblwjgl_(vma|shaderc|spvc)\.so" || {
            echo "the AAR does not contain liblwjgl_vma/shaderc/spvc"; exit 1; }
          # And fail loudly if anything else survived, because that is the bug this step exists
          # to prevent.
          if unzip -l app_pojavlauncher/libs/lwjgl-3.3.3-natives-release.aar | grep -E '\.so$' | grep -vE "liblwjgl_(vma|shaderc|spvc)\.so"; then
            echo "a library the launcher should not ship survived the strip"; exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔥🔥🔥 ये है नया Cache Method – सीधे Gradle Caches को Store/Restore करेगा 🔥🔥🔥
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Create out directory
        run: mkdir out

      - name: Decode release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.keystore"

      # Release + Google Play steps run only for FearLauncher itself (owner check
      # keeps forks from publishing) and only on the release branch. The Play
      # steps additionally wait for the Play secrets to exist.
      - name: Build FearLauncher Publishing .aab (Google Play)
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH && env.HAS_PLAY_UPLOAD == 'true'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/FearLauncher-gplay.aab

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleFullDebug
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/FearLauncher-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FearLauncher-debug-noruntime.apk

      - name: Build FearLauncher Nightly Release .apk
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
            echo "Release signing secrets found: building the SIGNED release APK."
            gradle :app_pojavlauncher:assembleFullRelease
            mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/FearLauncher-release.apk
          else
            echo "No release signing secrets found: publishing the existing public release build."
            gradle :app_pojavlauncher:assembleFullPubRelease
            mv app_pojavlauncher/build/outputs/apk/full/pubRelease/app_pojavlauncher-full-pubRelease.apk out/FearLauncher-release.apk
          fi

      - name: Generate MD5 checksums
        run: |
          md5sum out/FearLauncher-debug-full.apk > out/FearLauncher-debug-full.md5
          md5sum out/FearLauncher-debug-noruntime.apk > out/FearLauncher-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FearLauncher-debug-full
          path: out/FearLauncher-debug-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: FearLauncher-debug-noruntime
          path: out/FearLauncher-debug-noruntime.apk

      - name: Publish FearLauncher Nightly Release (GitHub Release)
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH
        uses: softprops/action-gh-release@v3
        with:
          name: FearLauncher Nightly
          prerelease: true
          tag_name: nightly
          body: |
            FearLauncher nightly build.
            Branch: ${{ github.ref_name }}
            Commit hash: ${{ github.sha }}
          files: |
            out/FearLauncher-release.apk

      - name: Upload FearLauncher AAB (Google Play)
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH && env.HAS_PLAY_UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FearLauncher-release-aab
          path: out/FearLauncher-gplay.aab

      - name: Upload FearLauncher to Google Play (internal track)
        continue-on-error: true
        if: github.repository_owner == 'minetwice' && github.ref_name == env.FEARLAUNCHER_RELEASE_BRANCH && env.HAS_PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: com.fearlauncher.fear
          releaseFiles: out/FearLauncher-gplay.aab
          track: internal
          inAppUpdatePriority: 5
