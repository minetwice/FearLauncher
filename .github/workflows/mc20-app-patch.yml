name: MC20 App Patch (panfork renderer)

# Runs scripts/mc20_patch_app_ci.py, which idempotently wires the "panfork"
# renderer into the app and commits the result. A repair step first fixes
# known transport corruption inside the pushed patch script.
on:
  push:
    branches: [ Mega-checkpoint ]
    paths:
      - 'scripts/mc20_patch_app_ci.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc20-app-patch
  cancel-in-progress: true

jobs:
  patch:
    name: Apply panfork app patches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Repair patch script
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import hashlib
          p = Path('scripts/mc20_patch_app_ci.py')
          t = p.read_text()
          B = 'Gall' + 'ium_driver=panfrost'
          G = 'GAL' + 'LIUM_DRIVER=panfrost'
          fixes = [
              (B, G),
              (' ' * 7 + 't = t.replace(old, new, 1)', ' ' * 8 + 't = t.replace(old, new, 1)'),
              ('RENDERER_VK_ZIN' + 'C', 'RENDERER_VK_ZIN' + 'K'),
              ('t.co' + 'unv(', 't.co' + 'unt('),
          ]
          applied = []
          for bad, good in fixes:
              if bad in t and bad != good:
                  n = t.count(bad)
                  t = t.replace(bad, good)
                  applied.append('%d replacement(s)' % n)
          p.write_text(t)
          print('post-fix sha1:', hashlib.sha1(t.encode()).hexdigest())
          print('applied:', applied if applied else 'none')
          PY

      - name: Run patch script
        run: python3 scripts/mc20_patch_app_ci.py

      - name: Commit patched files
        run: |
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/JREUtils.java app_pojavlauncher/src/main/res/values/headings_array.xml app_pojavlauncher/src/main/jni/jvm_hooks/lwjgl_dlopen_hook.c
          if git diff --cached --quiet; then
            echo "Nothing to patch"
          else
            git pull --rebase || true
            git commit -m "feat: MC20 - Panfork renderer app wiring (via mc20_patch_app_ci.py)"
            git push
          fi
