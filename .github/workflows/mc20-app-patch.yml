name: MC20 App Patch (panfork renderer)

# Runs scripts/mc20_patch_app_ci.py, which idempotently wires the "panfork"
# renderer into the app (JREUtils.java, headings_array.xml incl. restoring the
# accidentally dropped customctrl_selectdefault menu entry, lwjgl_dlopen_hook.c)
# and commits the result. The first step repairs known transport corruption
# in the pushed patch script.
on:
  push:
    branches: [ Mega-checkpoint ]
    paths:
      - 'scripts/mc20_patch_app_ci.py'
      - 'scripts/mc20_fix.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc20-app-patch
  cancel-in-progress: true

jobs:
  patch:
    name: Apply panfork app patches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Repair patch script (transport corruption fixes)
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path('scripts/mc20_patch_app_ci.py')
          t = p.read_text()
          fixed = []
          fixes = [
              ('Gallium_driver=panfrost', 'GALLIUM_DRIVER=panfrost'),
              ('       t = t.replace(old, new, 1)', '        t = t.replace(old, new, 1)'),
              ('RENDERER_VK_ZINC', 'RENDERER_VK_ZINK'),
              ('t.counv(', 't.count('),
          ]
          for bad, good in fixes:
              if bad in t and bad != good:
                  n = t.count(bad)
                  t = t.replace(bad, good)
                  fixed.append('%s -> %s (x%d)' % (bad, good, n))
          p.write_text(t)
          import hashlib
          data = t.encode()
          print('post-fix sha1:', hashlib.sha1(data).hexdigest())
          print('fixes applied:', fixed if fixed else 'none')
          PY

      - name: Run patch script
        run: python3 scripts/mc20_patch_app_ci.py

      - name: Commit patched files
        run: |
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/JREUtils.java app_pojavlauncher/src/main/res/values/headings_array.xml app_pojavlauncher/src/main/jni/jvm_hooks/lwjgl_dlopen_hook.c
          if git diff --cached --quiet; then
            echo "Nothing to patch"
          else
            git pull --rebase || true
            git commit -m "feat: MC20 - Panfork renderer app wiring (via mc20_patch_app_ci.py)"
            git push
          fi
