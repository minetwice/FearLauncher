name: MC22 Build PanVK-Kbase driver (arm64)

# Builds libvulkan_panfrost.so from the funnymdzz Mesa fork (26.3.0-devel)
# with the KBASE kernel backend enabled, and commits it into jniLibs.
#
# Why: vanilla Mesa PanVK only talks to the mainline `panthor` kernel driver,
# which does not exist on Android - Android Mali kernels expose `kbase`.
# That made every previous PanVK build enumerate 0 GPUs and crash zink at
# OSMesaCreateContextAttribs (null pipe_screen -> SIGSEGV).
# The funnymdzz fork ships a kbase/CSF pan_kmod backend (leegao/mesa-funnymdzz,
# validated on Mali-G720 kbase/CSF by wonderkast02/panvk-g720-kbase-csf), so we
# build from it with -Dpanfrost-kmds=kbase,panthor following the fork's own
# CI recipe (llvm-20, libclc-20, anon_file memfd patch, tools=panfrost host
# build, android.toml cross file + shims) plus our app-namespace fixes:
#   1. --default-library=static links the libdrm subproject in.
#   2. surgical build.ninja patch adds -Wl,-u,vk_icd* to the final .so link.
#   3. rewritten vulkan-android.sym also exports the vk_icd* entrypoints.
#   4. STUB libui.so replaces the real one (real libui needs HIDL libs like
#      android.hardware.graphics.allocator@2.0.so which the app namespace
#      cannot load -> dlopen of the whole driver fails). Stubs return -1 so
#      u_gralloc treats gralloc4/5 as unsupported; OSMesa never uses WSI.
#   5. -static-libstdc++ removes the libc++.so DT_NEEDED.
#   6. hard verification gate on vk_icd* exports.
#   7. The stub libui.so is FORCE-copied over jniLibs (a stale real libui.so
#      from an older build must never survive - it breaks dlopen).
#   8. wonderkast02's CSF register-count fix: the fork hardcodes cs_reg_count
#      = 96 which faults on non-G720 GPUs (G615!) once register pressure
#      rises - read the real count from the hardware instead.
# NOTE: the NDK bin dir is deliberately NOT added to global PATH - its
# llvm-config (LLVM 21) breaks the host LLVM-20 build. NDK tools are exported
# per-step instead.
on:
  push:
    branches: [ Mega-checkpoint ]
    paths:
      - '.github/workflows/mc22-build-panvk-kbase.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc22-build-panvk-kbase
  cancel-in-progress: true

jobs:
  build-panvk-kbase:
    name: PanVK-Kbase aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout bleeding-edge Mesa fork (kbase/CSF support)
        uses: actions/checkout@v4
        with:
          repository: leegao/mesa-funnymdzz
          ref: ci
          path: mesa

      - name: Point at the preinstalled NDK (fork CI uses NDK_LATEST)
        run: |
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Patch anon_file.c for memfd_create (SDK 30+)
        run: |
          cd mesa
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) && !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c
          grep -n "memfd" src/util/anon_file.c | head -3

      - name: Patch CSF register count (hardcoded 96 faults non-G720 GPUs like G615)
        run: |
          cd mesa
          cat > /tmp/regcount.patch << 'EOF'
          From a6799dbeb02ff1c3677f491767fd35929994e58c Mon Sep 17 00:00:00 2001
          From: wonderkast02 (G720 CS register count fix)
          Subject: [PATCH] panvk/kbase: use CSF-reported register count

          The kbase backend hardcoded cs_reg_count = 96. G615 (Valhall v11)
          reports a different WORK_REGS value, so the CS builder allocated
          registers the hardware does not have -> GPU fault -> freeze once
          shader register pressure rises (texture atlas stage).
          ---
           src/panfrost/lib/kmod/kbase_kmod.c           | 4 +++-
           src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c | 2 ++
           2 files changed, 5 insertions(+), 1 deletion(-)

          diff --git a/src/panfrost/lib/kmod/kbase_kmod.c b/src/panfrost/lib/kmod/kbase_kmod.c
          index 2caa459..2be7f6f 100644
          --- a/src/panfrost/lib/kmod/kbase_kmod.c
          +++ b/src/panfrost/lib/kmod/kbase_kmod.c
          @@ -455,7 +455,9 @@ kbase_query_csif_info(int fd, struct drm_panthor_csif_info *csif)
             *csif = (struct drm_panthor_csif_info){
                .csg_slot_count = group_num,
                .cs_slot_count = groups[0].stream_num,
          -      .cs_reg_count = 96,
          +      /* Same encoding used by panthor:
          +       * bits [7:0] contain WORK_REGS - 1. */
          +      .cs_reg_count = (stream_features & 0xff) + 1,
                .scoreboard_slot_count =
                   (scoreboard_slot_count - 1) < 16 ? scoreboard_slot_count : 8,
                /* Number of CS registers the FW may clobber; matches panthor's
          diff --git a/src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c b/src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c
          index ca0392d..40f7ac7 100644
          --- a/src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c
          +++ b/src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c
          @@ -494,6 +494,8 @@ kbase_subqueue_emit_job(struct panvk_gpu_queue *queue, uint32_t subqueue,
             };
             struct cs_builder_conf conf = {
                .nr_registers = csif_info->cs_reg_count,
          +      .nr_kernel_registers =
          +         MAX2(csif_info->unpreserved_cs_reg_count, 4),
                .ls_sb_slot = SB_ID(LS),
             };
             struct cs_builder b;
          --
          2.53.0
          EOF
          git apply /tmp/regcount.patch && echo "regcount patch APPLIED" || (echo "git apply failed, trying fuzz"; patch -p1 --fuzz=3 < /tmp/regcount.patch)
          echo "--- verify:"
          grep -n "cs_reg_count" src/panfrost/lib/kmod/kbase_kmod.c | head -2
          grep -n "nr_kernel_registers" src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c | head -3

      - name: Install Build Dependencies (LLVM 20 like the fork's CI)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential llvm-20-dev libclang-20-dev libclc-20-dev \
            libllvmspirvlib-20-dev libelf-dev spirv-tools bison flex libdrm-dev pkg-config \
            cmake python3-mako python3-pip
          pip3 install --user "meson>=1.4.0" ninja packaging pyyaml
          meson --version
          cat mesa/VERSION || true

      - name: Build Host Tools (mesa-clc, vtn-bindgen2, panfrost_compile)
        run: |
          cd mesa
          meson setup build-host \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          ln -sf "build-host/src/compiler/clc/mesa_clc" "build-host/src/compiler/clc/mesa-clc"
          ln -sf "build-host/src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/mesa/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/mesa/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/mesa/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Create Android Cross File (fork's android.toml via envsubst)
        run: |
          which envsubst || sudo apt-get install -y gettext-base
          cd mesa
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE/mesa"
          envsubst < android.toml > "$GITHUB_WORKSPACE/android-aarch64.txt"
          cat "$GITHUB_WORKSPACE/android-aarch64.txt"

      - name: Export ICD entrypoints (Mesa Android version script demotes all to local)
        run: |
          cat > mesa/src/vulkan/vulkan-android.sym << 'EOF'
          {
            global:
              HMI;
              vk_icdGetInstanceProcAddr;
              vk_icdGetPhysicalDeviceProcAddr;
              vk_icdNegotiateLoaderICDInterfaceVersion;
              vk_icdEnumerateInstanceExtensionProperties;
              vk_icdEnumerateInstanceLayerProperties;
            local:
              *;
          };
          EOF
          cat mesa/src/vulkan/vulkan-android.sym

      - name: Create libhardware stub (app namespace cannot load system libhardware.so)
        run: |
          cat > hwstub.c << 'EOF'
          #include <stdint.h>
          struct hw_module_t;
          /* Stub: u_gralloc backends call this, fail gracefully when it errors.
             The zink+OSMesa path never imports Android HW buffers, so gralloc
             is not needed at all - it only must not break dlopen. */
          int hw_get_module(const char* id, const struct hw_module_t** module) {
              (void) id; (void) module;
              return -2;
          }
          int hw_get_module_by_class(const char* class_id, const char* id, const struct hw_module_t** module) {
              (void) class_id; (void) id; (void) module;
              return -2;
          }
          EOF
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          aarch64-linux-android30-clang -c hwstub.c -o "$GITHUB_WORKSPACE/hwstub.o"
          ls -la "$GITHUB_WORKSPACE/hwstub.o"

      - name: Create libui stub (real libui.so needs HIDL libs the app namespace cannot load)
        run: |
          cat > uistub.S << 'EOF'
          .text
          .globl _ZN7android19GraphicBufferMapper12getDataspaceEPK13native_handlePNS_8hardware8graphics6common4V1_29DataspaceE
          _ZN7android19GraphicBufferMapper12getDataspaceEPK13native_handlePNS_8hardware8graphics6common4V1_29DataspaceE:
              mov x0, #-1
              ret
          .globl _ZN7android19GraphicBufferMapper15getChromaSitingEPK13native_handlePN4aidl7android8hardware8graphics6common12ChromaSitingE
          _ZN7android19GraphicBufferMapper15getChromaSitingEPK13native_handlePN4aidl7android8hardware8graphics6common12ChromaSitingE:
              mov x0, #-1
              ret
          .globl _ZN7android19GraphicBufferMapper15getPlaneLayoutsEPK13native_handlePNSt3__16vectorIN4aidl7android8hardware8graphics6common11PlaneLayoutENS4_9allocatorISB_EEEE
          _ZN7android19GraphicBufferMapper15getPlaneLayoutsEPK13native_handlePNSt3__16vectorIN4aidl7android8hardware8graphics6common11PlaneLayoutENS4_9allocatorISB_EEEE:
              mov x0, #-1
              ret
          .globl _ZN7android19GraphicBufferMapper20getPixelFormatFourCCEPK13native_handlePj
          _ZN7android19GraphicBufferMapper20getPixelFormatFourCCEPK13native_handlePj:
              mov x0, #-1
              ret
          .globl _ZN7android19GraphicBufferMapper22getPixelFormatModifierEPK13native_handlePm
          _ZN7android19GraphicBufferMapper22getPixelFormatModifierEPK13native_handlePm:
              mov x0, #-1
              ret
          .globl _ZN7android19GraphicBufferMapperC1Ev
          _ZN7android19GraphicBufferMapperC1Ev:
              ret
          .data
          .balign 8
          .globl _ZN7android9SingletonINS_19GraphicBufferMapperEE9sInstanceE
          _ZN7android9SingletonINS_19GraphicBufferMapperEE9sInstanceE:
              .zero 8
          .globl _ZN7android9SingletonINS_19GraphicBufferMapperEE5sLockE
          _ZN7android9SingletonINS_19GraphicBufferMapperEE5sLockE:
              .zero 64
          EOF
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          aarch64-linux-android30-clang -shared -nostdlib -o uistub.so uistub.S -Wl,-soname,libui.so
          ls -la uistub.so
          # Swap the real shims/libui.so (HIDL deps -> dlopen fails in app namespace)
          # for our stub BEFORE configure+link. u_gralloc sees gralloc4/5 as
          # unsupported (stubs return -1) and falls back - OSMesa path never
          # uses Android WSI anyway.
          cp -v uistub.so mesa/shims/libui.so

      - name: Configure Meson for Android ARM64 (kbase kernel backend!)
        run: |
          cd mesa
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$HOME/.local/bin:$PATH
          # Drop shims/libdrm.pc so libdrm falls back to the static subproject.
          rm -f shims/libdrm.pc
          meson setup build-android \
            --cross-file ../android-aarch64.txt \
            --default-library=static \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dgallium-drivers= \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dallow-fallback-for=libdrm \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dvulkan-drivers=panfrost \
            -Dllvm=disabled \
            -Dpanfrost-kmds=kbase,panthor
          echo "--- kmds option check:"
          grep -o '"panfrost-kmds"[^}]*}' build-android/meson-info/intro-buildoptions.json | head -c 300 || true

      - name: Force ICD exports into the final link (surgical build.ninja patch)
        run: |
          cd mesa/build-android
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" python3 - << 'PYEOF'
          import os
          import re
          p = 'build.ninja'
          t = open(p).read()
          flags = ' ' + os.environ['GITHUB_WORKSPACE'] + '/hwstub.o -static-libstdc++ -Wl,--undefined-version -Wl,-u,vk_icdGetInstanceProcAddr -Wl,-u,vk_icdNegotiateLoaderICDInterfaceVersion -Wl,-u,vk_icdEnumerateInstanceExtensionProperties -Wl,-u,vk_icdEnumerateInstanceLayerProperties'
          idx = None
          for m in re.finditer(r'^build[^\n]*$', t, re.M):
              line = m.group(0)
              if line.startswith('build ') and 'libvulkan_panfrost.so:' in line and '_LINKER' in line:
                  idx = m.start()
                  print('EDGE FOUND:', line[:220])
                  break
          if idx is None:
              for m in re.finditer(r'^[^\n]*libvulkan_panfrost[^\n]*$', t, re.M):
                  print('CANDIDATE:', m.group(0)[:220])
              raise SystemExit('libvulkan_panfrost.so linker edge not found')
          m2 = re.search(r'^[ ]+LINK_ARGS = ', t[idx:], re.M)
          if m2 is None:
              print(t[idx:idx+900])
              raise SystemExit('LINK_ARGS not found after linker edge')
          li = idx + m2.end()
          end = t.index(chr(10), li)
          t = t[:end] + flags + t[end:]
          open(p, 'w').write(t)
          print('PATCHED LINK_ARGS:', t[li:end][:300])
          PYEOF

      - name: Compile Mesa (PanVK + kbase backend)
        run: |
          cd mesa
          ninja -C build-android
          echo "Compilation successful"

      - name: Verify PanVK exports (hard gate)
        run: |
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd mesa/build-android/src/panfrost/vulkan
          ls -la libvulkan_panfrost.so
          echo "--- kbase backend objects:"
          find ../../ -name "kbase_kmod*.o" 2>/dev/null | head -5
          echo "--- defined vk_icd symbols:"
          llvm-nm -D --defined-only libvulkan_panfrost.so | grep vk_icd || true
          if ! llvm-nm -D --defined-only libvulkan_panfrost.so | grep -q vk_icdGetInstanceProcAddr; then
            echo "FATAL: vk_icdGetInstanceProcAddr is NOT exported - build unusable"
            exit 1
          fi
          echo "--- undefined external deps:"
          llvm-nm -D --undefined-only libvulkan_panfrost.so | awk '{print $NF}' | sed 's/@.*//' | sort -u | head -40 || true
          echo "--- DT_NEEDED entries:"
          llvm-readelf -d libvulkan_panfrost.so | grep NEEDED || true
          echo "--- ship needed shims libs into jniLibs (stub libui + anything else missing):"
          for lib in $(llvm-readelf -d libvulkan_panfrost.so | grep NEEDED | sed 's/.*\[\(.*\)\].*/\1/'); do
            if [ -f "$GITHUB_WORKSPACE/mesa/shims/$lib" ] && [ ! -f "$GITHUB_WORKSPACE/app_pojavlauncher/src/main/jniLibs/arm64-v8a/$lib" ]; then
              cp -v "$GITHUB_WORKSPACE/mesa/shims/$lib" "$GITHUB_WORKSPACE/app_pojavlauncher/src/main/jniLibs/arm64-v8a/$lib"
            fi
          done
          ls -la "$GITHUB_WORKSPACE/app_pojavlauncher/src/main/jniLibs/arm64-v8a/" | grep -i "ui.so\|panfrost" || true

      - name: Commit driver into jniLibs
        run: |
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd mesa/build-android/src/panfrost/vulkan
          llvm-strip --strip-debug libvulkan_panfrost.so
          ls -la libvulkan_panfrost.so
          cp -v libvulkan_panfrost.so "$GITHUB_WORKSPACE/app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so"
          cd "$GITHUB_WORKSPACE"
          ls -la app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so
          # Drop stale real shims copies (HIDL-laden / redundant).
          rm -f app_pojavlauncher/src/main/jniLibs/arm64-v8a/libsync.so \
                app_pojavlauncher/src/main/jniLibs/arm64-v8a/liblog.so \
                app_pojavlauncher/src/main/jniLibs/arm64-v8a/libnativewindow.so \
                app_pojavlauncher/src/main/jniLibs/arm64-v8a/libc++.so
          # FORCE the stub over any stale REAL libui.so left by older builds
          # (the verify-step copy is skipped when a file already exists).
          cp -f mesa/shims/libui.so app_pojavlauncher/src/main/jniLibs/arm64-v8a/libui.so
          ls -la app_pojavlauncher/src/main/jniLibs/arm64-v8a/libui.so
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add app_pojavlauncher/src/main/jniLibs/arm64-v8a/
          if git diff --cached --quiet; then
            echo "Driver unchanged, nothing to commit"
          else
            git pull --rebase || true
            git commit -m "feat: MC22 - PanVK kbase driver v4 (G615 CSF register count fix - GPU fault freeze solved)"
            git push
            echo "MC22: PanVK kbase driver committed"
          fi
