name: mc6 patch
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: apply mc6
        run: python3 scripts/mc6.py
      - name: commit
        run: |
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "fix: MC6 - escape apostrophe in xerr_no_account (build fix)"
          git push
