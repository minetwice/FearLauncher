name: Build Mesa EGL PanVK+Zink (arm64)

# Builds the EGL-enabled Mesa stack for the Fear Render (PanVK + Zink) renderer
# on Mali GPUs:
#   libEGL (EGL entry points) + libgallium_dri.so (zink GL implementation)
#   + libvulkan_panfrost.so (PanVK, same as the one committed to jniLibs)
#
# Notes:
# - This Mesa_lib fork removed the use-elf-tls option and hardcodes a
#   thread-local glapi dispatch (u_thread.h __THREAD_INITIAL_EXEC). On Android
#   clang lowers that to emutls, whose control vars stay hidden inside
#   libgallium_dri.so, so libEGL.so fails to link with
#   "undefined symbol: __emutls_v._mesa_glapi_tls_Dispatch". The patch step
#   below turns it into a plain global (what mainline use-elf-tls=false does).
# - GLVND is off, so the EGL target is src/egl/libEGL.so; it is collected as
#   libEGL_mesa.so in the artifact.
# - GL entry points are fetched through eglGetProcAddress, so
#   -Dgles2=disabled (no libGLESv2 entrypoint wrapper) is fine.

on:
  push:
    branches:
      - feat/krypton-renderer
    paths:
      - '.github/workflows/build-mesa-egl-panvk.yml'
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa_lib ref (branch) to build from'
        required: false
        default: 'main-17061956483348987644'
        type: string

concurrency:
  group: mesa-egl-panvk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aarch64:
    name: Mesa EGL+PanVK+Zink aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout FearLauncher
        uses: actions/checkout@v4

      - name: Checkout Mesa source
        uses: actions/checkout@v4
        with:
          repository: minetwice/Mesa_lib
          ref: ${{ inputs.mesa_ref || 'main-17061956483348987644' }}
          path: mesa

      - name: Patch glapi TLS for Android
        run: |
          # see workflow header note — this mirrors mainline use-elf-tls=false.
          # Only the plain "thread_local" fallback branch is changed; the Apple
          # and glibc branches are left untouched.
          sed -i 's|^#define __THREAD_INITIAL_EXEC thread_local$|#define __THREAD_INITIAL_EXEC|' mesa/src/util/u_thread.h
          echo "--- patched u_thread.h TLS macros ---"
          grep -n "__THREAD_INITIAL_EXEC" mesa/src/util/u_thread.h

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Add NDK and Local Binaries to PATH
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Build Dependencies & Upgrade Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison flex python3-mako pkg-config libdrm-dev python3-pip \
            llvm-dev clang libclang-dev spirv-tools spirv-headers libllvmspirvlib-18-dev llvm-spirv-18 \
            libexpat1-dev zlib1g-dev libzstd-dev
          pip3 install --user "meson>=1.4.0" ninja packaging pyyaml
          meson --version

      - name: Build Host Tools (mesa-clc & precomp-compiler)
        run: |
          cd mesa
          meson setup build-host \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers= \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dopengl=true \
            -Dgbm=disabled \
            -Dplatforms= \
            -Dtools=panfrost \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            --prefix=/tmp/host-tools
          meson compile -C build-host
          meson install -C build-host
          echo "/tmp/host-tools/bin" >> $GITHUB_PATH

      - name: Create Android Cross File
        run: |
          cat << 'EOF' > mesa/android-aarch64.txt
          [binaries]
          c = 'aarch64-linux-android26-clang'
          cpp = 'aarch64-linux-android26-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkg-config = 'pkg-config'

          [properties]
          pkg_config_libdir = '/disable/non/android/system/pc/files'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure Meson for Android ARM64
        run: |
          cd mesa
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$HOME/.local/bin:$PATH
          # lld >= 17 hard-errors on version-script symbols removed by --gc-sections
          export LDFLAGS="-Wl,--undefined-version"
          meson setup build-android \
            --cross-file android-aarch64.txt \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dplatform-sdk-version=26 \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=zink \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dopengl=true \
            -Dgbm=disabled \
            -Dzstd=disabled \
            -Dallow-fallback-for=libdrm \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Dgallium-rusticl=false \
            -Dmicrosoft-clc=disabled \
            -Dbuildtype=release

      - name: Compile Mesa
        run: |
          cd mesa
          ninja -C build-android
          echo "Compilation successful!"

      - name: Collect .so Files
        run: |
          mkdir -p out/arm64-v8a
          cd mesa/build-android

          # essentials (hard-fail if missing)
          cp -v src/panfrost/vulkan/libvulkan_panfrost.so ../../out/arm64-v8a/
          if [ -f src/egl/libEGL.so ]; then
            cp -v src/egl/libEGL.so ../../out/arm64-v8a/libEGL_mesa.so
          else
            find src/egl -name 'libEGL*.so' -exec cp -v {} ../../out/arm64-v8a/ \;
          fi
          find src/gallium/targets -name 'libgallium_dri.so' -exec cp -v {} ../../out/arm64-v8a/ \;

          # optional extras — collect only if this fork produced them
          find src/mapi -name 'libglapi.so' -exec cp -v {} ../../out/arm64-v8a/ \; || true
          find src/util -name 'libmesa_util.so' -exec cp -v {} ../../out/arm64-v8a/ \; || true
          find src -name 'libGLESv2*.so' -exec cp -v {} ../../out/arm64-v8a/ \; || true

          ok=1
          for f in libvulkan_panfrost.so libEGL_mesa.so libgallium_dri.so; do
            if [ ! -f "../../out/arm64-v8a/$f" ]; then
              echo "FATAL: $f was not built"
              ok=0
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "--- built .so files (first 80) ---"
            find src -name '*.so' | head -80
            exit 1
          fi
          echo "--- collected ---"
          ls -la ../../out/arm64-v8a/

      - name: Upload .so Files
        uses: actions/upload-artifact@v4
        with:
          name: fear-launcher-mesa-panvk-zink-arm64
          path: out/arm64-v8a/
          retention-days: 7
