name: Setup Krypton Wrapper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  setup-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and install libng_gl4es.so
        id: install
        run: |
          set -e
          echo "Fetching latest Krypton release..."
          API="https://api.github.com/repos/BZLZHH/NGG-FCLRendererPlugin/releases/latest"
          curl -sL "$API" -o /tmp/release.json
          TAG=$(python3 -c "import json; print(json.load(open('/tmp/release.json'))['tag_name'])")
          URL=$(python3 -c "
          import json
          assets = json.load(open('/tmp/release.json')).get('assets', [])
          for a in assets:
              if a['name'].endswith('.apk'):
                  print(a['browser_download_url'])
                  break
          ")
          if [ -z "$URL" ]; then
            echo "ERROR: No APK found in release $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Downloading $URL ..."
          curl -L --fail -o /tmp/krypton.apk "$URL"
          echo "Extracting libng_gl4es.so ..."
          mkdir -p /tmp/extract
          unzip -o /tmp/krypton.apk "lib/arm64-v8a/libng_gl4es.so" -d /tmp/extract
          TARGET="app_pojavlauncher/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET"
          cp -f /tmp/extract/lib/arm64-v8a/libng_gl4es.so "$TARGET/libng_gl4es.so"
          ls -lh "$TARGET/libng_gl4es.so"
          echo "Installed successfully (tag $TAG)"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_pojavlauncher/src/main/jniLibs/arm64-v8a/libng_gl4es.so || true
          if git diff --staged --quiet; then
            echo "No changes – lib already up to date"
          else
            git commit -m "chore(renderer): setup Krypton Wrapper libng_gl4es.so (${{ steps.install.outputs.tag }})"
            git push
            echo "Pushed libng_gl4es.so"
          fi
