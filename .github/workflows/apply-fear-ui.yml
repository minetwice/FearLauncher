name: apply-fear-ui
on:
  push:
    branches: [chore/fear-ui-apply]
permissions:
  contents: write
concurrency:
  group: apply-fear-ui
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare target worktree
        run: |
          git fetch origin feat/krypton-renderer
          git worktree add /tmp/target FETCH_HEAD
      - name: Assemble patch script
        run: cat .fear-parts/part_* > /tmp/apply.py && python3 -m py_compile /tmp/apply.py
      - name: Apply and push
        run: python3 /tmp/apply.py
        working-directory: /tmp/target
