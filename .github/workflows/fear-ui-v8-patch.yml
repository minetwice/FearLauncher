name: fear-ui v8 patch
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: apply v8
        run: |
          echo  | base64 -d > /tmp/patch_step8.py
          python3 /tmp/patch_step8.py
      - name: commit
        run: |
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "fear-ui v8: remove Fear Render core (libs/assets/UI), recorder export restyle (black + crimson glass)"
          git push
