name: MC19 Build PanVK driver (arm64)

# Builds libvulkan_panfrost.so (PanVK) and commits it into jniLibs.
# Export fixes vs old sync-panvk-driver build:
#   1. --default-library=static links the libdrm subproject in (old binary
#      had UND drm* symbols -> would fail to dlopen).
#   2. surgical build.ninja patch adds -Wl,-u,vk_icd* to the final .so link
#      only (global c_link_args would poison meson's link checks).
#   3. Mesa's Android version script (vulkan-android.sym) demotes EVERYTHING
#      except HMI to local - rewritten to also export the vk_icd* entrypoints.
#   4. Mesa's android_stub links libhardware.so / libc++_shared.so as NEEDED -
#      neither is loadable inside the app namespace, so hw_get_module is
#      stubbed out and libstdc++ is linked statically (--as-needed drops the
#      NEEDED entries).
#   5. Hard verification: FAILS unless vk_icdGetInstanceProcAddr is exported and
#      the binary no longer NEEDs libhardware/libc++_shared.
on:
  push:
    branches: [ Mega-checkpoint ]
    paths:
      - '.github/workflows/mc19-build-panvk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc19-build-panvk
  cancel-in-progress: true

jobs:
  build-panvk:
    name: PanVK aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/checkout@v4
        with:
          repository: minetwice/Mesa_lib
          ref: fix-android-panvk-ci-build-17445916338120130569
          path: mesa

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Add NDK and Local Binaries to PATH
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Build Dependencies & Upgrade Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison flex python3-mako pkg-config libdrm-dev python3-pip \
            llvm-dev clang libclang-dev spirv-tools spirv-headers libllvmspirvlib-18-dev llvm-spirv-18 \
            libexpat1-dev zlib1g-dev libzstd-dev
          pip3 install --user "meson>=1.4.0" ninja packaging pyyaml
          meson --version

      - name: Build Host Tools (mesa-clc & precomp-compiler)
        run: |
          cd mesa
          meson setup build-host \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers= \
            -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dglx=disabled \
            -Dopengl=true -Dgbm=disabled -Dplatforms= \
            -Dtools=panfrost \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            --prefix=/tmp/host-tools
          meson compile -C build-host
          meson install -C build-host
          echo "/tmp/host-tools/bin" >> $GITHUB_PATH

      - name: Create Android Cross File
        run: |
          printf '%s\n' \
            '[binaries]' \
            "c = 'aarch64-linux-android26-clang'" \
            "cpp = 'aarch64-linux-android26-clang++'" \
            "ar = 'llvm-ar'" \
            "strip = 'llvm-strip'" \
            "pkg-config = 'pkg-config'" \
            '' \
            '[properties]' \
            "pkg_config_libdir = '/disable/non/android/system/pc/files'" \
            '' \
            '[host_machine]' \
            "system = 'android'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" > android-aarch64.txt
          cat android-aarch64.txt

      - name: Export ICD entrypoints (Mesa Android version script demotes all to local)
        run: |
          cat > mesa/src/vulkan/vulkan-android.sym << 'EOF'
          {
            global:
              HMI;
              vk_icdGetInstanceProcAddr;
              vk_icdGetPhysicalDeviceProcAddr;
              vk_icdNegotiateLoaderICDInterfaceVersion;
              vk_icdEnumerateInstanceExtensionProperties;
              vk_icdEnumerateInstanceLayerProperties;
            local:
              *;
          };
          EOF
          cat mesa/src/vulkan/vulkan-android.sym

      - name: Create libhardware stub (app namespace cannot load system libhardware.so)
        run: |
          cat > hwstub.c << 'EOF'
          #include <stdint.h>
          struct hw_module_t;
          /* Stub: u_gralloc backends call this, fail gracefully when it errors.
             The zink+OSMesa path never imports Android HW buffers, so gralloc
             is not needed at all - it only must not break dlopen. */
          int hw_get_module(const char* id, const struct hw_module_t** module) {
              (void) id; (void) module;
              return -2;
          }
          int hw_get_module_by_class(const char* class_id, const char* id, const struct hw_module_t** module) {
              (void) class_id; (void) id; (void) module;
              return -2;
          }
          EOF
          aarch64-linux-android26-clang -c hwstub.c -o "$GITHUB_WORKSPACE/hwstub.o"
          ls -la "$GITHUB_WORKSPACE/hwstub.o"

      - name: Configure Meson for Android ARM64
        run: |
          cd mesa
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$HOME/.local/bin:$PATH
          meson setup build-android \
            --cross-file ../android-aarch64.txt \
            --default-library=static \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dplatform-sdk-version=26 \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=zink \
            -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dglx=disabled \
            -Dopengl=true -Dgbm=disabled \
            -Dzstd=disabled \
            -Dallow-fallback-for=libdrm \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Dgallium-rusticl=false \
            -Dmicrosoft-clc=disabled \
            -Dbuildtype=release

      - name: Force ICD exports into the final link (surgical build.ninja patch)
        run: |
          cd mesa/build-android
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" python3 - << 'PYEOF'
          import os
          import re
          p = 'build.ninja'
          t = open(p).read()
          flags = ' ' + os.environ['GITHUB_WORKSPACE'] + '/hwstub.o -static-libstdc++ -Wl,--undefined-version -Wl,-u,vk_icdGetInstanceProcAddr -Wl,-u,vk_icdNegotiateLoaderICDInterfaceVersion -Wl,-u,vk_icdEnumerateInstanceExtensionProperties -Wl,-u,vk_icdEnumerateInstanceLayerProperties'
          idx = None
          for m in re.finditer(r'^build[^\n]*$', t, re.M):
              line = m.group(0)
              if line.startswith('build ') and 'libvulkan_panfrost.so:' in line and '_LINKER' in line:
                  idx = m.start()
                  print('EDGE FOUND:', line[:220])
                  break
          if idx is None:
              for m in re.finditer(r'^[^\n]*libvulkan_panfrost[^\n]*$', t, re.M):
                  print('CANDIDATE:', m.group(0)[:220])
              raise SystemExit('libvulkan_panfrost.so linker edge not found')
          m2 = re.search(r'^[ ]+LINK_ARGS = ', t[idx:], re.M)
          if m2 is None:
              print(t[idx:idx+900])
              raise SystemExit('LINK_ARGS not found after linker edge')
          li = idx + m2.end()
          end = t.index(chr(10), li)
          t = t[:end] + flags + t[end:]
          open(p, 'w').write(t)
          print('PATCHED LINK_ARGS:', t[li:end][:300])
          PYEOF

      - name: Compile Mesa
        run: |
          cd mesa
          ninja -C build-android
          echo "Compilation successful"

      - name: Verify PanVK exports (hard gate)
        run: |
          cd mesa/build-android/src/panfrost/vulkan
          ls -la libvulkan_panfrost.so
          echo "--- defined vk_icd symbols:"
          llvm-nm -D --defined-only libvulkan_panfrost.so | grep vk_icd || true
          if ! llvm-nm -D --defined-only libvulkan_panfrost.so | grep -q vk_icdGetInstanceProcAddr; then
            echo "FATAL: vk_icdGetInstanceProcAddr is NOT exported - build unusable"
            exit 1
          fi
          echo "--- undefined external deps (should be libc/libm/libdl/liblog only):"
          llvm-nm -D --undefined-only libvulkan_panfrost.so | awk '{print $NF}' | sed 's/@.*//' | sort -u | head -40 || true
          echo "--- DT_NEEDED entries:"
          llvm-readelf -d libvulkan_panfrost.so | grep NEEDED || true
          if llvm-readelf -d libvulkan_panfrost.so | grep -q 'libhardware.so'; then
            echo "FATAL: still linked against libhardware.so - not loadable in the app namespace"
            exit 1
          fi
          if llvm-readelf -d libvulkan_panfrost.so | grep -q 'libc++_shared.so'; then
            echo "FATAL: still linked against libc++_shared.so - not shipped in the APK"
            exit 1
          fi

      - name: Commit driver into jniLibs
        run: |
          cd mesa/build-android/src/panfrost/vulkan
          llvm-strip --strip-debug libvulkan_panfrost.so
          ls -la libvulkan_panfrost.so
          cp -v libvulkan_panfrost.so "$GITHUB_WORKSPACE/app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so"
          cd "$GITHUB_WORKSPACE"
          ls -la app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so
          if git diff --cached --quiet; then
            echo "Driver unchanged, nothing to commit"
          else
            git pull --rebase || true
            git commit -m "feat: MC19 - PanVK driver v2 (app-safe deps: no libhardware, no libc++_shared)"
            git push
            echo "MC19: PanVK driver committed"
          fi
