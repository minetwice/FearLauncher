name: MC20 Build Panfork OSMesa (arm64)

# Builds libOSMesa_panfork.so from PojavLauncherTeam/panfork_offscreen_rootless
# (csf branch: Mesa 23.0 + icecream95's pan_base kbase userspace) and commits
# it into jniLibs.
#
# Rendering path: LWJGL -> OSMesa -> Gallium panfrost -> ARM kbase kernel
# driver (the SAME kernel driver the proprietary blob uses - proven to open
# from the app process). No proprietary userspace blob (the mali glitch
# source on this device), no Vulkan, no Zink translation layer.
#
# GPU: Mali-G615 (Valhall v10 CSF) - same generation as the G610/G710 the
# csf branch targets; unknown GPU IDs fall back to panfrost_unknown_model.
#
# GL: 3.3 desktop unlocked at runtime via PAN_MESA_DEBUG=gl3 (set by the
# app for the "panfork" renderer). AFBC off via noafbc (Minecraft block
# texture glitches).
#
# Pipeline (libdrm static + meson cross) proven green in
# minetwice/Panfork-for-mali run 3545787744 (swrast fallback build).
on:
  push:
    branches: [ Mega-checkpoint ]
    paths:
      - '.github/workflows/mc20-build-panfork.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc20-build-panfork
  cancel-in-progress: true

jobs:
  build-panfork:
    name: Panfork OSMesa aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout Panfork (Pojav csf branch)
        uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/panfork_offscreen_rootless
          ref: csf
          path: mesa

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Add NDK and Local Binaries to PATH 
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH 
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config python3-mako python3-pip gettext-base bison flex libdrm-dev
          pip3 install --user "meson>=1.2.0" ninja packaging pyyaml
          meson --version

      - name: Create Android Cross File
        run: |
          printf '%s\n' \
             '[binaries]' \
            "ar = 'llvm-ar'" \
            "c = 'aarch64-linux-android26-clang'" \
            "cpp = 'aarch64-linux-android26-clang++'" \
            "c_ld = 'lld'" \
            "cpp_ld = 'lld'" \
            "strip = 'llvm-strip'" \
            "pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/tmp/drm-static/lib/pkgconfig', '/usr/bin/pkg-config']" \
            '' \
            '[properties]' \
            '' \
            '[host_machine]' \
            "system = 'android'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'aarch64'" \
            "endian = 'little'" > android-aarch64.txt
          cat android-aarch64.txt

      - name: Build libdrm (static, for Android)
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/drm.git
          cd drm
          meson setup build-android \
            --prefix=/tmp/drm-static \
            --cross-file ../android-aarch64.txt \
            -Ddefault_library=static \
            -Dintel=disabled \
            -Dradeon=disabled \
            -Damdgpu=disabled \
            -Dnouveau=disabled \
            -Dvmwgfx=disabled \
            -Dvc4=disabled \
            -Detnaviv=disabled \
            -Dman-pages=disabled \
            -Dtests=false
          ninja -C build-android install
          ls /tmp/drm-static/lib/pkgconfig/

      - name: Patch Mesa (robust kbase device open)
        run: |
          cd mesa
          python3 - << 'PYEOF'
          from pathlib import Path
          p = Path('src/gallium/auxiliary/target-helpers/inline_sw_helper.h')
          t = p.read_text()
          if 'PAN_KBASE_DEVICE' in t:
              print('inline_sw_helper.h already patched')
          else:
              old = 'int kbase_device_fd = open("/dev/mali0", O_RDWR | O_CLOEXEC | O_NONBLOCK);'
              new = (
                  'int kbase_device_fd = -1;\n'
                  '         {\n'
                  '            const char* kbase_paths[3];\n'
                  '            int npaths = 0;\n'
                  '            const char* env_dev = getenv("PAN_KBASE_DEVICE");\n'
                  '            if (env_dev && env_dev[0]) kbase_paths[npaths++] = env_dev;\n'
                  '            kbase_paths[npaths++] = "/dev/mali0";\n'
                  '            kbase_paths[npaths++] = "/dev/mali";\n'
                  '            for (int _i = 0; _i < npaths; _i++) {\n'
                  '               kbase_device_fd = open(kbase_paths[_i], O_RDWR | O_CLOEXEC | O_NONBLOCK);\n'
                  '               if (kbase_device_fd != -1) {\n'
                  '                  fprintf(stderr, "PANFORK: opened kbase device %s (fd=%d)\\n", kbase_paths[_i], kbase_device_fd);\n'
                  '                  break;\n'
                  '               }\n'
                  '               fprintf(stderr, "PANFORK: open(%s) failed: %s\\n", kbase_paths[_i], strerror(errno));\n'
                  '            }\n'
                  '         }'
              )
              if old not in t:
                  for i, line in enumerate(t.splitlines()):
                      if 'kbase_device_fd = open(' in line:
                          print('loose match line %d: %r' % (i + 1, line))
                  raise SystemExit('FAILED: kbase open() line not found in inline_sw_helper.h')
              t = t.replace(old, new, 1)
              p.write_text(t)
              print('patched inline_sw_helper.h: PAN_KBASE_DEVICE + /dev/mali0 + /dev/mali fallback')
          t2 = Path('src/gallium/auxiliary/target-helpers/inline_sw_helper.h').read_text()
          assert 'panfrost_create_screen' in t2, 'panfrost hook missing?!'
          print('panfrost_create_screen hook present: OK')
          PYEOF

      - name: Apply MC20 soft-blit patch (panfrost CPU blit fallback)
        run: |
          python3 scripts/mc20_softblit_patch.py mesa

      - name: Configure Meson for Android ARM64
        run: |
          cd mesa
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$HOME/.local/bin:$PATH
          meson setup build-android \
            --cross-file ../android-aarch64.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dandroid-stub=true \
            -Dllvm=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=true \
            -Dosmesa=true \
            -Dvulkan-drivers= \
            -Dgallium-drivers=panfrost,swrast \
            -Dshared-glapi=false \
            -Dbuildtype=release

      - name: Compile Mesa
        run: |
          cd mesa
          ninja -C build-android
          echo "Compilation successful"

      - name: Verify Panfork OSMesa (hard gate)
        run: |
          cd mesa/build-android/src/gallium/targets/osmesa
          ls -la
          LIB=$(ls libOSMesa*.so* | head -1)
          echo "lib: $LIB"
          echo "--- OSMesa exports:"
          llvm-nm -D --defined-only "$LIB" | grep -i osmesacreatecontext || true
          if ! llvm-nm -D --defined-only "$LIB" | grep -q "OSMesaCreateContext"; then
            echo "FATAL: OSMesaCreateContext not exported"
            exit 1
          fi
          echo "--- panfrost wired in (string counts):"
          strings "$LIB" | grep -c "panfrost" || true
          strings "$LIB" | grep "PANFORK\\|/dev/mali" | head -5 || true
          if ! strings "$LIB" | grep -q "/dev/mali"; then
            echo "FATAL: kbase device open path missing - panfrost not compiled in?"
            exit 1
          fi
          echo "--- panfrost model table present:"
          strings "$LIB" | grep -E "^G[0-9]+$|^G57$|^G610$" | head -5 || true
          echo "--- DT_NEEDED entries:"
          llvm-readelf -d "$LIB" | grep NEEDED || true
          # libc++_shared.so NEEDED is FINE - it is already shipped in the APK jniLibs.

      - name: Commit driver into jniLibs
        run: |
          cd mesa/build-android/src/gallium/targets/osmesa
          LIB=$(ls libOSMesa*.so* | head -1)
          llvm-strip --strip-debug "$LIB"
          ls -la "$LIB"
          cp -v "$LIB" "$GITHUB_WORKSPACE/app_pojavlauncher/src/main/jniLibs/arm64-v8a/libOSMesa_panfork.so"
          cd "$GITHUB_WORKSPACE"
          ls -la app_pojavlauncher/src/main/jniLibs/arm64-v8a/libOSMesa_panfork.so
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add app_pojavlauncher/src/main/jniLibs/arm64-v8a/libOSMesa_panfork.so
          if git diff --cached --quiet; then
            echo "Driver unchanged, nothing to commit"
          else
            git pull --rebase || true
            git commit -m "feat: MC20 - Panfork OSMesa (open-source Panfrost GL on kbase kernel driver, via OSMesa)"
            git push
            echo "MC20: Panfork OSMesa committed"
          fi
