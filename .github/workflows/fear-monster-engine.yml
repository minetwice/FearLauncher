name: Fear Monster engine

# Builds the direct-Vulkan engine from source with our overlay applied, and publishes the
# jar to the nightly release, named for the Minecraft version it serves. Deliberately NOT
# wired into the app build: this workflow only reports whether the engine builds, so a
# failure here can never break the launcher release.
#
# It runs when the overlay changes, and on demand.

on:
  workflow_dispatch:
  push:
    paths:
      - 'fear-monster/**'
      - '.github/workflows/fear-monster-engine.yml'

# Uploading a release asset needs contents: write, which the default token does not have.
permissions:
  contents: write

jobs:
  build-engine:
    name: Build Fear Monster engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher (for the overlay)
        uses: actions/checkout@v4

      # JDK 21, not 17: fabric-loom, the build plugin the engine uses, refuses to
      # resolve on a 17 JVM - "Dependency requires at least JVM runtime version 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clone the engine source
        run: |
          set -uo pipefail
          git clone --depth 1 --branch dev https://github.com/xCollateral/VulkanMod.git "$RUNNER_TEMP/engine"
          cd "$RUNNER_TEMP/engine"
          mkdir -p build/libs
          echo "engine commit: $(git rev-parse HEAD)"

      - name: Apply our overlay
        run: |
          set -uo pipefail
          if [ -d "$GITHUB_WORKSPACE/fear-monster/overlay" ]; then
            cp -rv "$GITHUB_WORKSPACE/fear-monster/overlay/." "$RUNNER_TEMP/engine/"
          fi
          ls -la "$RUNNER_TEMP/engine"

      # The engine's own Maven dependencies stay - 3.3.3, the version its source is written
      # against - and so does include(), which is what puts them in the jar. Only the
      # runtimeOnly natives includes go, because LWJGL's linux natives are glibc builds and
      # cannot load on Android at all. The natives are the launcher's job and ship in the APK.
      - name: Drop the desktop natives, keep the bindings
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/engine"
          F=build.gradle
          python3 - "$F" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          lines = src.split('\n')
          out = []
          dropped = []
          for ln in lines:
              s = ln.strip()
              if s.startswith('include(runtimeOnly("$name:'):
                  dropped.append(s)
                  continue
              if s.startswith('include(runtimeOnly("org.lwjgl:lwjgl-vulkan'):
                  dropped.append(s)
                  continue
              out.append(ln)
          report = ['--- dropped ' + str(len(dropped)) + ' native includes ---']
          report += ['  - ' + d for d in dropped]
          open('build/libs/patch-report.txt', 'w').write('\n'.join(report) + '\n')
          print('\n'.join(report))
          if len(dropped) != 6:
              sys.exit("expected 6 native includes in " + path + ", dropped " + str(len(dropped)))
          open(path, 'w').write('\n'.join(out))
          PY

      # The engine's surface has to come from vkCreateAndroidSurfaceKHR on this platform,
      # and its instance has to ask for VK_KHR_android_surface. Two lines in Vulkan.java
      # carry both.
      #
      # This step fails if either line is not found. Upstream moves; a patch that quietly
      # stops applying would produce a jar that builds, looks right, and does nothing.
      - name: Point the engine at the Android surface
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/engine"
          F=src/main/java/net/vulkanmod/vulkan/Vulkan.java
          python3 - "$F" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          subs = [
              (
                  "glfwCreateWindowSurface(Instance.instance, window, null, pSurface)",
                  "FearAndroidSurface.createSurface(Instance.instance.address(), pSurface)",
              ),
              (
                  "List<String> otherExtensions = new ArrayList<>();",
                  "List<String> otherExtensions = new ArrayList<>();\n"
                  "            otherExtensions.add(\"VK_KHR_android_surface\");",
              ),
          ]
          for old, new in subs:
              if old not in src:
                  sys.exit("patch target not found in " + path + ": " + old)
              src = src.replace(old, new, 1)
          open(path, "w").write(src)
          print("patched " + path)
          PY
          echo "--- what the patch produced ---"
          grep -n "FearAndroidSurface\|VK_KHR_android_surface" "$F" || true

      # Both teardown loops asked something other than the list they were walking, and each
      # was a crash on the first frame:
      #
      #   IndexOutOfBoundsException: Index 8 out of bounds for length 8
      #   IndexOutOfBoundsException: Index 0 out of bounds for length 0
      #     at Renderer.destroySyncObjects(Renderer.java:626)
      #     at Renderer.recreateSwapChain(Renderer.java:580)
      #     at Renderer.beginFrame(Renderer.java:238)
      #
      # The second loop used swapChain.getImagesNum(), but recreateSwapChain() calls
      # swapChain.recreate() first, so that count is the NEW one while
      # renderFinishedSemaphores still holds the OLD one.
      #
      # The first loop used framesNum, which survives the reassignment a few lines later but
      # not the case that actually fires: the first recreateSwapChain runs before
      # createSyncObjects has ever run, so both lists are empty while framesNum is not.
      #
      # Scoped to destroySyncObjects: the same header appears again in beginFrame, and
      # replacing the first match edited that one instead.
      - name: Fix the swapchain teardown
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/engine"
          F=src/main/java/net/vulkanmod/vulkan/Renderer.java
          python3 - "$F" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          start = src.index('private void destroySyncObjects()')
          end = src.index('public void addOnResizeCallback', start)
          body = src[start:end]
          for a, b in (
              (
                  'for (int i = 0; i < framesNum; ++i) {',
                  'for (int i = 0; i < inFlightFences.size(); ++i) {',
              ),
              (
                  'for (int i = 0; i < swapChain.getImagesNum(); ++i) {',
                  'for (int i = 0; i < renderFinishedSemaphores.size(); ++i) {',
              ),
          ):
              if a not in body:
                  sys.exit("teardown loop not found in " + path + ": " + a)
              body = body.replace(a, b)
          src = src[:start] + body + src[end:]
          open(path, "w").write(src)
          print("patched destroySyncObjects in " + path)
          PY
          echo "--- what the patch produced ---"
          grep -n "inFlightFences.size()\|renderFinishedSemaphores.size()" "$F" || true
          python3 - "$F" <<'PY'
          import sys
          src = open(sys.argv[1]).read()
          start = src.index('private void destroySyncObjects()')
          end = src.index('public void addOnResizeCallback', start)
          body = src[start:end]
          for bad in ('i < framesNum; ++i', 'i < swapChain.getImagesNum(); ++i'):
              if bad in body:
                  sys.exit("the teardown loop is still there: " + bad)
          for good in ('inFlightFences.size()', 'renderFinishedSemaphores.size()'):
              if good not in body:
                  sys.exit("the teardown loop was not rewritten: " + good)
          print("destroySyncObjects verified")
          PY

      # The engine rotates the image a second time, and this is the fix.
      #
      # The GL renderers present correctly here. OSMesa, which is what the working path
      # uses, does this:
      #
      #   ANativeWindow_setBuffersGeometry(surface, 0, 0, WINDOW_FORMAT_RGBA_8888);
      #   w = ANativeWindow_getWidth(...); h = ANativeWindow_getHeight(...);
      #   osm_blit_to_native(...);   /* rows copied straight in, no rotation anywhere */
      #
      # It renders into the surface's own size and hands the image over untouched; the Android
      # compositor does the rotating. That is the "no pre-rotation" path in Google's Vulkan
      # guidance: swapchain dimensions match the surface, preTransform stays IDENTITY, and the
      # compositor rotates. The other path - pre-rotation - keeps the swapchain at its
      # identity dimensions, sets preTransform to currentTransform, AND rotates the MVP
      # matrix in the app.
      #
      # VulkanMod does the first half of pre-rotation and not the second: it sets
      # preTransform to currentTransform, with an extent that is the window's rather than the
      # identity one, and rotates nothing else. So the presentation engine turns the image
      # while the UI was laid out before that turn.
      #
      # IDENTITY, then, exactly as the GL path does it. Android reports every transform as
      # supported, so it is always accepted. The literal is used instead of the constant so
      # this cannot fail to compile over an import.
      - name: Present without pre-rotation, the way the GL renderers do
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/engine"
          F=src/main/java/net/vulkanmod/vulkan/framebuffer/SwapChain.java
          python3 - "$F" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = 'createInfo.preTransform(surfaceProperties.capabilities.currentTransform());'
          new = ('createInfo.preTransform(0x00000001); /* FEAR: VK_SURFACE_TRANSFORM_IDENTITY_BIT_KHR -'
                 ' no pre-rotation, the compositor rotates, exactly as the GL renderers do */')
          if old not in src:
              sys.exit("the preTransform line is not in " + path + " any more")
          src = src.replace(old, new, 1)
          open(path, "w").write(src)
          print("patched preTransform in " + path)
          PY
          echo "--- what the patch produced ---"
          grep -n "preTransform" "$F" || true
          if grep -q 'currentTransform()' "$F"; then
            echo "the preTransform line is still asking for currentTransform"
            exit 1
          fi

      # remapJar is asked for by name: "build" may not depend on it, and the unremapped jar
      # is the one whose access widener is named, which Fabric refuses in production.
      #
      # clean first, and that is not tidiness: fabric-loom keeps its own build output, and a
      # run without it repackaged a previously compiled Renderer.class. The source had the
      # teardown fix and the jar did not, so the engine published, installed, and crashed on
      # the first frame exactly as it had before. The jar size not moving is what gave it
      # away.
      - name: Build the engine
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/engine"
          chmod +x gradlew
          ./gradlew --no-daemon clean build remapJar 2>&1 | tee build/libs/gradle-build.txt
          echo "--- every jar the build produced ---"
          find build -name '*.jar' -printf '%s\t%p\n' | sort -rn

      # The engine hooks Minecraft's own classes, so a build serves exactly one Minecraft
      # version and has to be named for it. Read it from the engine's own build files
      # rather than being told: a build published under the wrong version is an engine
      # that cannot load, which is worse than a red run.
      - name: Work out which Minecraft version this engine serves
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/engine"
          MC=$(grep -iE '^[[:space:]]*minecraft(_version)?[[:space:]]*=' gradle.properties 2>/dev/null | head -1 | cut -d= -f2 | tr -d ' \r')
          if [ -z "$MC" ]; then
            echo "could not read the Minecraft version out of gradle.properties:"
            cat gradle.properties || true
            exit 1
          fi
          echo "MC_VERSION=$MC" >> "$GITHUB_ENV"
          echo "engine serves Minecraft $MC"

      # The nightly release is where the launcher looks, and where the Discord SDK already
      # lives.
      #
      # --repo is not optional: this step runs from the engine checkout, and gh resolves
      # the repository from the git remote in the working directory - which is
      # xCollateral/VulkanMod, where this token has no rights. Naming our own repository
      # explicitly is what makes the upload land.
      #
      # Two things have to be true of the jar that is published, and both have been got
      # wrong in different ways:
      #
      #   It has to BE the engine. build/ holds more than the engine - loom extracts the
      #   Fabric API modules the engine bundles, and those are remapped too. Picking by
      #   widener alone published fabric-resource-loader-v1 as the engine, and the game
      #   then died on a missing fabric-api-base. The mod's own id is the only thing that
      #   settles it.
      #
      #   It has to be remapped. The dev jar's access widener is in the named namespace,
      #   which Fabric refuses in production; build/libs holds the dev jar and the sources
      #   jar and nothing else, so taking the first jar published a sources jar whose
      #   fabric.mod.json was the unprocessed one.
      #
      # Everything considered is written to build/libs/publish-report.txt, which the artifact
      # step picks up.
      - name: Publish the engine to the nightly release
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/engine"
          REPORT=build/libs/publish-report.txt
          : > "$REPORT"
          {
            echo "--- every jar under build/ ---"
            find build -name '*.jar' -printf '%s\t%p\n' 2>/dev/null | sort -rn || true
          } | tee -a "$REPORT"

          JAR=""
          for cand in $(find build -name '*.jar' 2>/dev/null); do
            case "$cand" in *-sources.jar) continue;; esac
            MODJSON=$(unzip -p "$cand" fabric.mod.json 2>/dev/null || true)
            ID=$(printf '%s' "$MODJSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
            AW=$(printf '%s' "$MODJSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('accessWidener',''))" 2>/dev/null || true)
            HDR=$(unzip -p "$cand" "$AW" 2>/dev/null | head -1 || true)
            echo "candidate $cand -> id '$ID' widener '$AW' header '$HDR'" | tee -a "$REPORT"
            if [ "$ID" != "vulkanmod" ]; then
              continue
            fi
            case "$HDR" in
              *named*) continue;;
            esac
            JAR="$cand"
            break
          done

          if [ -z "$JAR" ]; then
            echo "no vulkanmod jar with an intermediary access widener was produced" | tee -a "$REPORT"
            exit 1
          fi
          echo "publishing $JAR" | tee -a "$REPORT"

          NAME="fear-monster-engine-${MC_VERSION}.jar"
          cp "$JAR" "/tmp/$NAME"
          echo "uploading $NAME ($(stat -c%s "/tmp/$NAME") bytes) to $GITHUB_REPOSITORY" | tee -a "$REPORT"
          gh release upload nightly "/tmp/$NAME" --clobber --repo "$GITHUB_REPOSITORY"
          echo "published $NAME" | tee -a "$REPORT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # always(): a failed publish must not also throw the build away - and the whole
      # build/libs directory is taken, so the reports and the gradle output travel with it.
      - name: Upload the engine jars, the reports and the build log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fear-monster-engine
          path: /home/runner/work/_temp/engine/build/libs/
          if-no-files-found: warn
