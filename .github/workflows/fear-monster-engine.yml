name: Fear Monster engine

# Builds the direct-Vulkan engine from source with our overlay applied, and uploads
# the jar as an artifact. Deliberately NOT wired into the app build: this workflow
# only reports whether the engine builds, so a failure here can never break the
# launcher release.
#
# It runs when the overlay changes, and on demand.

on:
  workflow_dispatch:
  push:
    paths:
      - 'fear-monster/**'
      - '.github/workflows/fear-monster-engine.yml'

jobs:
  build-engine:
    name: Build Fear Monster engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher (for the overlay)
        uses: actions/checkout@v4

      # JDK 21, not 17: fabric-loom, the build plugin the engine uses, refuses to
      # resolve on a 17 JVM - "Dependency requires at least JVM runtime version 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clone the engine source
        run: |
          set -uo pipefail
          git clone --depth 1 --branch dev https://github.com/xCollateral/VulkanMod.git "$RUNNER_TEMP/engine"
          cd "$RUNNER_TEMP/engine"
          echo "engine commit: $(git rev-parse HEAD)"

      - name: Apply our overlay
        run: |
          set -uo pipefail
          if [ -d "$GITHUB_WORKSPACE/fear-monster/overlay" ]; then
            cp -rv "$GITHUB_WORKSPACE/fear-monster/overlay/." "$RUNNER_TEMP/engine/"
          fi
          ls -la "$RUNNER_TEMP/engine"

      - name: Build the engine
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/engine"
          chmod +x gradlew
          ./gradlew --no-daemon build
          # No "| head" here: the build has already succeeded by this point, and a
          # closed pipe from head made find exit non-zero, which failed the step on an
          # otherwise perfectly good build.
          ls -l build/libs/

      - name: Upload the engine jar
        uses: actions/upload-artifact@v4
        with:
          name: fear-monster-engine
          path: /home/runner/work/_temp/engine/build/libs/*.jar
          if-no-files-found: warn
