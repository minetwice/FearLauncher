name: Build FearRender (GL on GLES, arm64)

# FearRender = self-compiled GL-on-GLES renderer built from the open-source
# MobileGlues core (LGPL-2.1, github.com/MobileGL-Dev/MobileGlues), patched
# via tools/fearrender/fearpatch.py and wired into the launcher via
# tools/fearrender/fearwire.py (both idempotent). Safe to re-run.
on:
  workflow_dispatch:

concurrency:
  group: fearrender-build
  cancel-in-progress: true

jobs:
  build-aarch64:
    name: FearRender arm64 + wiring + shader-diag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake unzip curl git

      - name: Download NDK
        run: |
          curl -L "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          rm ndk.zip

      - name: Clone MobileGlues (pinned)
        run: |
          git clone --filter=blob:none https://github.com/MobileGL-Dev/MobileGlues.git mg
          cd mg
          git checkout 97558a69157b033b890958b1e49258c5b51a80c6
          git submodule update --init --depth 1 \
            MobileGlues-cpp/3rdparty/xxhash \
            MobileGlues-cpp/3rdparty/glslang \
            MobileGlues-cpp/3rdparty/SPIRV-Cross \
            MobileGlues-cpp/include/ska

      - name: 'FEARPATCH (MobileGlues source - shader-fail diagnostics)'
        run: python3 tools/fearrender/fearpatch.py mg/MobileGlues-cpp

      - name: Build libmobileglues.so
        run: |
          cmake -S mg/MobileGlues-cpp -B mg-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/android-ndk-r27c/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C mg-build
          ls -la mg-build/libmobileglues.so
          $PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip mg-build/libmobileglues.so
          ls -la mg-build/libmobileglues.so

      - name: 'FEARWIRE (launcher wiring - MG config + Sodium bypass + libname)'
        run: python3 tools/fearrender/fearwire.py

      - name: Commit + push (libFearRender.so + wiring)
        run: |
          cp mg-build/libmobileglues.so app_pojavlauncher/src/main/jniLibs/arm64-v8a/libFearRender.so
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add app_pojavlauncher/src/main/jniLibs/arm64-v8a/libFearRender.so \
                  app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/JREUtils.java \
                  app_pojavlauncher/src/main/res/values/headings_array.xml \
                  app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/jre/GameRunner.java \
                  tools/fearrender/
          if git diff --cached --quiet; then
            echo "No change to push"
          else
            git commit -m "FearRender: MobileGlues shader config (MG_DIR_PATH + ignore-error/compute) + shader-fail diagnostics"
            git push
            echo "PUSHED FearRender"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fearrender-arm64
          path: app_pojavlauncher/src/main/jniLibs/arm64-v8a/libFearRender.so
          if-no-files-found: error
          retention-days: 30
