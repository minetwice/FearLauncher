name: mc17 patch
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: apply mc17
        run: python3 scripts/mc17.py
      - name: commit
        run: |
          git config user.name "Twicefear"
          git config user.email "ytd82774@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "fix: MC17 - ultimate zink glitch fix for Mali (mipmap off + full sync submission)"
          git push
